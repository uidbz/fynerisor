name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build, vet, test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        # GLFW's Go bindings compile the X11 AND Wayland backends by
        # default on Linux; the wayland-client headers are not preinstalled.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Issue #47: docs/API.md is generated from the compiled attr
      # registries (#38); regenerate and fail on any drift.
      - name: API docs drift
        run: |
          go run ./cmd/fynerisor docs -o docs/API.md
          git diff --exit-code docs/API.md

      # The acceptance criterion of issue #45: the entire tree runs clean
      # under the race detector (the per-run vmexec model and the UI-thread
      # routing in docs/CONCURRENCY.md must hold).
      - name: go test -race
        run: go test -race -count=1 ./...

  # Issue #58: surface a future Risor v2 release before it is tagged.
  # This job is allowed to fail: it is a heads-up, not a merge gate.
  risor-v2-canary:
    name: risor v2 branch canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Upgrade to the risor v2 branch head
        run: go get github.com/deepnoodle-ai/risor/v2@v2

      - name: build, vet, test
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...
